[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudscope"
version = "0.1.0"
description = "Statistical anomaly detection for tabular datasets"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "statsmodels", "matplotlib", "openpyxl"]

[project.optional-dependencies]
dev = ["pytest", "nbformat", "ruff", "black", "astropy"]
app = [
    "streamlit==1.40.1; python_version < '3.11'",
    "streamlit==1.67.0; python_version >= '3.11'",
    "scikit-learn==1.5.2; python_version < '3.11'",
    "scikit-learn==1.9.1; python_version >= '3.11'",
    "jinja2==3.1.6",
    "reportlab==4.5.1",
]

[tool.setuptools]
packages = ["fraudscope", "fraudscope.ml", "fraudscope.report", "benford"]
package-dir = {"benford" = "benford_py/benford"}

[tool.setuptools.package-data]
"fraudscope.report" = ["templates/*.j2", "fonts/*.ttf", "fonts/LICENSE.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "benford_py/tests"]
